name: Playwright landing checks

on:
  push:
    branches: [fix/landing-responsive-pass]

permissions:
  contents: read

jobs:
  landing:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright@1.55.0 install --with-deps chromium
      - name: Run app build
        run: npm run build
      - name: Run landing responsive checks
        run: npx playwright test --project=chromium
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: landing-playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
