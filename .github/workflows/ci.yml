name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/landing-toxic-violet-product-led"
      - "feat/refine-nav-faq-final-cta"
      - "feat/clean-premium-navbar-and-close"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visibilio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install scanner browser revision
        run: node node_modules/playwright/cli.js install chromium

      - name: Check formatting
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR "$GITHUB_BASE_REF...$GITHUB_SHA" | grep -E '\\.(ts|tsx|js|jsx|json|css|md|yml|yaml)$' || true)"
          else
            files="$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD | grep -E '\\.(ts|tsx|js|jsx|json|css|md|yml|yaml)$' || true)"
          fi
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs npx prettier --check --log-level warn
          else
            echo "No format-eligible changed files."
          fi

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run scanner tests
        run: npm run test:scanner

      - name: Run API tests
        run: npm run test:api

      - name: Run landing responsive checks
        run: npx playwright test --project=chromium
