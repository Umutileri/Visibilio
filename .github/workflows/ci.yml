name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR "$GITHUB_BASE_REF...$GITHUB_SHA" | grep -E '\\.(ts|tsx|js|jsx|json|css|md|yml|yaml)$' || true)"
          else
            files="$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD | grep -E '\\.(ts|tsx|js|jsx|json|css|md|yml|yaml)$' || true)"
          fi
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs npx prettier --check --log-level warn
          else
            echo "No format-eligible changed files."
          fi

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run scanner tests
        run: npm run test:scanner

      - name: Run API tests
        run: npm run test:api
