name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check -- --log-level warn

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run scanner tests
        run: npm run test:scanner

      - name: Run API tests
        run: npm run test:api
